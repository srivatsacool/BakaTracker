    <!--
      BAKATRACKER — LIFE OS (frontend direction contract, master brief 2026-08-16)
      THESIS: Your life as a personal life operating system floating inside an
        animated fibre-optic world. The tunnel is the environment; the app is a
        stable floating structure inside a moving world — one lit pane in the
        tunnel for the whole day. Refuses the stock dark-glass dashboard default.
      OWN-WORLD: violet-indigo LightTunnel (ogl/WebGL, cables #8B5CF6 / pulses
        #A78BFA / tunnel #312E81, outward flow, restrained glow/brightness,
        grain, subtle mouse) at z0; a layered dark readability overlay at z1
        (translucent base rgba(4,5,15,0.58) + radial darkening + edge vignette —
        never a flat black layer; TEXT ALWAYS WINS); the application at z10+ as
        a floating smoked-glass shell — 20px breathing room, rounded 20px frame,
        hairline border + inner top highlight + layered shadow, NO
        backdrop-filter on the frame (fixed children must keep anchoring to the
        viewport). Three zones: left instrument rail (where am I) / centre life
        workspace (what am I doing) / right BakaSur intelligence (who is helping
        me). Violet #8b5cf6 primary (bright #a78bfa for text, deep #7c3aed for
        fills); tool tones as hairline band edges: Today=violet, Habits=teal,
        Tasks=coral, Eisenhower=amber, Journal+Notes=rose, Journey=cobalt;
        Archivo display / Fragment Mono instrument readouts / Inter body,
        all self-hosted; glow scarce (BakaSur, active item, XP, completion);
        pane states OFF / ATTRACT / PLAYING / HIGH SCORE / OUT OF ORDER named,
        never color alone.
      STORY: The visitor enters a world, not a dashboard. The tunnel flows
        behind the floating shell; completing a quest lights the pane and a star
        joins the tunnel; the save lamp is the backend's status light.
      FIRST VIEWPORT: The tunnel world with the dark overlay, the landing hero
        showing the REAL app floating in it — quests, XP, habits, BakaSur — with
        TRY LIVE DEMO and SIGN IN / CREATE YOUR INSTANCE.
      FORM: user master brief 2026-08-16 evening (supersedes the Night
        Observatory roll, seed 2efaae3b, and all earlier worlds).
      FINISH: unreviewed and undocumented is unfinished; this build ends with
        the finish review, the verdict, and DESIGN.md.
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
