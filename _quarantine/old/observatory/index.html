      BAKATRACKER — THE NIGHT OBSERVATORY (direction contract, seed 2efaae3b)
      THESIS: Your life as a night of observation — every tool a glass instrument
        panel lit from behind, the day's check-in as the one lit pane. Refuses the
        stock dark-glass dashboard default: the aurora accent and instrument
        grammar carry it past the category.
      OWN-WORLD: deep-void ground (#07060c → #0e0c17), content floating on layered
        frosted-glass panes (blur + hairline + luminance, never opacity alone),
        one aurora accent violet #6f5bd8 as the only lit color; instrument states
        OFF / ATTRACT / PLAYING / HIGH SCORE / OUT OF ORDER named, never color
        alone; tool tones as hairline band edges: Today=violet, Habits=teal,
        Tasks=coral, Eisenhower=amber, Journal+Notes=rose, Journey=cobalt;
        Archivo display / Fragment Mono instrument readouts / Inter body,
        all self-hosted.
      STORY: The visitor understands their life is a sky they observe; opening the
        app is raising the shutter on tonight's instruments; completing a quest
        lights a pane and adds a star to the night; the save lamp is the
        observatory's status light.
      FIRST VIEWPORT: The dark dome — the Day Line as one unbroken track with a
        running light showing where now is, the day's record on the one lit glass
        pane, the instrument rail (level + XP + status) as lit readouts on the
        left.
