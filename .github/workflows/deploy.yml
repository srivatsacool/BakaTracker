name: BakaTracker Backend CI/CD

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      # 1. Checkout repository code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Install uv and Python
      - name: Set up python and uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'

      # 3. Setup Virtualenv and Install Dependencies
      - name: Install dependencies
        run: |
          cd backend
          uv sync

      # 4. Local Health Check Test
      - name: Run Startup Verification Check
        env:
          GOOGLE_APPS_SCRIPT_URL: ${{ secrets.GOOGLE_APPS_SCRIPT_URL }}
          GOOGLE_APPS_SCRIPT_API_KEY: ${{ secrets.GOOGLE_APPS_SCRIPT_API_KEY }}
          AUTH_TOKEN: "ci_cd_test_token"
        run: |
          cd backend
          # Run uvicorn in the background
          uv run uvicorn main:app --port 8080 &
          # Wait for server to boot up
          sleep 5
          # Perform health checks
          curl -f http://localhost:8080/health
          curl -f http://localhost:8080/version
          curl -f http://localhost:8080/
          # Verify readiness with mock auth headers
          curl -f -H "Authorization: Bearer ci_cd_test_token" http://localhost:8080/ready
          # Stop the background process
          kill %1

      # 5. Authenticate to Google Cloud
      - name: Google Auth
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      # 6. Setup Google Cloud SDK
      - name: Set up Cloud SDK
        uses: 'google-github-actions/setup-gcloud@v2'

      # 7. Configure Docker auth for GCR
      - name: Configure Docker Auth
        run: |
          gcloud auth configure-docker --quiet

      # 8. Build and Push Docker image
      - name: Build and Push Container
        run: |
          docker build -t gcr.io/${{ secrets.GCP_PROJECT_ID }}/bakatracker-mcp:${{ github.sha }} -t gcr.io/${{ secrets.GCP_PROJECT_ID }}/bakatracker-mcp:latest ./backend
          docker push gcr.io/${{ secrets.GCP_PROJECT_ID }}/bakatracker-mcp:${{ github.sha }}
          docker push gcr.io/${{ secrets.GCP_PROJECT_ID }}/bakatracker-mcp:latest

      # 9. Deploy to Google Cloud Run
      - name: Deploy to Cloud Run
        id: deploy
        uses: 'google-github-actions/deploy-cloudrun@v2'
        with:
          service: 'bakatracker-mcp'
          image: 'gcr.io/${{ secrets.GCP_PROJECT_ID }}/bakatracker-mcp:${{ github.sha }}'
          region: 'us-central1'
          flags: |
            --cpu=0.25
            --memory=512Mi
            --concurrency=80
            --timeout=300
            --min-instances=0
            --max-instances=5
            --allow-unauthenticated
          env_vars: |
            GOOGLE_APPS_SCRIPT_URL=${{ secrets.GOOGLE_APPS_SCRIPT_URL }}
            GOOGLE_APPS_SCRIPT_API_KEY=${{ secrets.GOOGLE_APPS_SCRIPT_API_KEY }}
            AUTH_TOKEN=${{ secrets.AUTH_TOKEN }}
            AUTH_MODE=jwt
            AUTH0_DOMAIN=buildsrivatsa.us.auth0.com
            AUTH0_AUDIENCE=https://api.bakatracker.buildsrivatssa.qzz.io
            AUTH0_ISSUER=https://buildsrivatsa.us.auth0.com/
            AUTH0_CLIENT_ID=${{ secrets.AUTH0_CLIENT_ID }}
            OWNER_EMAIL=srivatsacool@gmail.com
            LOG_LEVEL=INFO

      # 10. Post-Deployment Remote Health Check
      - name: Verify Deployed Service
        run: |
          # Fetch the deployed service URL from output
          DEPLOYED_URL="${{ steps.deploy.outputs.url }}"
          echo "Deployed service URL is: $DEPLOYED_URL"
          # Run health check
          curl -f "$DEPLOYED_URL/health"
          # Run version check
          curl -f "$DEPLOYED_URL/version"
